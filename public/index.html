@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

:repeat(3,1fr)}.material-card{padding:19px}.material-type{display:inline-block;padding:6px 9px;border-radius:99px;background:var(--lav);font-weight:800;font-size:11px}.material-card h3{margin:13px 0 6px}.material-card p{font-size:13px;color:var(--muted);line-height:1.55}.material-card .btn{margin-top:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{padding:9px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.dash-card{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line)}.dash-card h3{margin:0 0 15px}.dash-card .row{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:13px}.dash-card .row small{color:var(--muted)}.profile-head{display:flex;align-items:center;gap:17px;padding:23px;background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:17px}.avatar{width:62px;height:62px;border-radius:20px;background:var(--yellow);display:grid;place-items:center;font-size:31px}.profile-head h2{margin:0 0 4px}.profile-metrics{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}.profile-metrics span{font-size:12px;background:#fff4e9;padding:7px 10px;border-radius:99px;font-weight:700}.overlay{position:fixed;inset:0;background:#261a1490;z-index:20;display:grid;place-items:center;padding:15px;overflow:auto}.modal{background:var(--cream);width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:24px;padding:25px;box-shadow:0 24px 80px #1b100d55}.modal h2{font:800 25px Manrope,sans-serif;margin:5px 0 7px}.modal>p{color:var(--muted);font-size:14px;margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-weight:700;font-size:12px}.form-group .field{width:100%}textarea.field{height:auto;padding:12px;resize:vertical;min-height:74px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.file-hint{font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#302821;color:#fff;padding:13px 18px;border-radius:13px;font-weight:700;opacity:0;transition:.25s;z-index:40;box-shadow:var(--shadow);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}
